# Один образ на окружение: `web` собирает naffai-backend, `demo-web` —
# naffai-demo-backend; все воркеры переиспользуют готовый образ
# (pull_policy: never), поэтому `docker compose build` = 2 сборки, а не 20,
# и на диске 2 образа вместо копии на каждый сервис.
# Деплой: `docker compose -f docker-compose.prod.yml up -d --build`,
# затем `docker image prune -f && docker builder prune -f --filter until=72h`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2026-08-22 Wave-1 — Redis for dashboard-summary + lead-stats cache
  # (TTL 60s, ручная инвалидация из sale/lead сервисов). База 1
  # (0 зарезервирована на будущее — celery/queue). Данных мало (десятки
  # ключей, до килобайта каждый) — no-persistence, restart сбрасывает всё.
  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: naffai-backend:latest
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Host bind so nginx (www-data) can serve /media/* directly.
      # `/var/lib/docker/volumes/` has mode 710 root:root and blocks www-data
      # even with the intermediate mode 701 dirs — hence the direct host path.
      - /var/www/naffai-media:/app/media
    # Без seed/superuser из entrypoint.sh — prod-база уже наполнена.
    command:
      - "bash"
      - "-c"
      - |
        set -e
        cd /app
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput --clear || true
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --preload --timeout 120 --max-requests 500 --max-requests-jitter 50 --access-logfile -

  # Demo backend — same image, но с БД naffai_demo (`.env.demo` override).
  # Отдельный порт 8001, nginx для demo.naff.flek.uz проксирует сюда.
  # Не имеет workers (bot, watchers) — они запускаются только у prod-web.
  # Deploy с ветки `demo`: git worktree в /opt/naffAI-demo.
  demo-web:
    build:
      context: /opt/naffAI-demo/backend
      dockerfile: Dockerfile
    image: naffai-demo-backend:latest
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - /var/www/naffai-media:/app/media
    command: ["/app/scripts/entrypoint.sh"]

  bot:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    environment:
      DOCKER_PROXY_URL: http://docker-proxy:2375
    command: ["python", "-m", "apps.tg_bot.runner"]
    profiles: ["bot"]

  # Read-only docker-socket-proxy для ops-агента бота: /health, /logs,
  # crash_watch. Всё remotely-destructive (POST/exec/start/stop/kill/build)
  # заглушено на уровне proxy. /var/run/docker.sock монтируется read-only.
  # Внешних портов нет — только compose-network. См. apps/tg_bot/docker_client.py.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    logging: *default-logging
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      NETWORKS: 0
      IMAGES: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles: ["bot"]

  # Telethon user-client — collects operator dialogs into TgMessage.
  # One long-lived asyncio loop; StringSession lives in Postgres so no
  # extra volume needed.
  userclient:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "run_tg_userclient"]

  # Scheduler — drives the TG dialog analyzer every 15 min.
  scheduler:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          echo "[$(date +%FT%T%z)] analyze_tg_dialogs start"
          python manage.py analyze_tg_dialogs || echo "analyze_tg_dialogs failed rc=$?"
          echo "[$(date +%FT%T%z)] analyze_tg_dialogs done — sleep 900s"
          sleep 900
        done

  # Nightly ops-cron: release stale leads (>10d untouched) and DM the
  # daily manager report. Simple bash loop, one iteration per calendar
  # day; scheduled at 23:30 local Tashkent (UTC+5) so it fires after
  # the CRM day ends.
  ops-nightly:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          # Compute seconds until next 23:30 Tashkent (UTC+5 → 18:30 UTC).
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 18:30' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=18,minute=30,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] ops-nightly sleep $$sleep_sec s (until 23:30 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] release_stale_leads --days 10"
          python manage.py release_stale_leads --days 10 || echo "release_stale_leads rc=$$?"
          echo "[$$(date +%FT%T%z)] check_stranded_leads"
          python manage.py check_stranded_leads || echo "check_stranded_leads rc=$$?"
          echo "[$$(date +%FT%T%z)] send_daily_manager_report"
          python manage.py send_daily_manager_report || echo "daily_report rc=$$?"
        done

  # Auto-close all open attendance logs every day at 22:00 Asia/Tashkent
  # (= 17:00 UTC). Anyone who forgot to `/checkout` gets their shift
  # force-closed AND auto-paused so overnight RR doesn't dump leads on
  # them. Command is `attendance_auto_close` (backend/apps/attendance).
  attendance-auto-close:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 17:00' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=17,minute=0,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] attendance-auto-close sleep $$sleep_sec s (until 22:00 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] attendance_auto_close"
          python manage.py attendance_auto_close || echo "attendance_auto_close rc=$$?"
        done

  # Apply approved day-off requests: каждый день в 00:05 Asia/Tashkent
  # (= 19:05 UTC) ставит is_paused=True всем операторам с одобренным
  # OperatorDayOff на сегодня. На следующий check-in пауза снимется
  # автоматически (если не занят другим day-off). Идемпотентно.
  apply-day-offs:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 19:05' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=19,minute=5,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] apply-day-offs sleep $$sleep_sec s (until 00:05 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] attendance_apply_day_offs"
          python manage.py attendance_apply_day_offs || echo "attendance_apply_day_offs rc=$$?"
        done

  # Demo-mirror
  demo-apply-day-offs:
    image: naffai-demo-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 19:05' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=19,minute=5,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] demo-apply-day-offs sleep $$sleep_sec s (until 00:05 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] attendance_apply_day_offs (demo DB)"
          python manage.py attendance_apply_day_offs || echo "attendance_apply_day_offs rc=$$?"
        done

  # Demo-scoped mirror of attendance-auto-close — writes to `naffai_demo`
  # via .env.demo override. Build context is /opt/naffAI-demo/backend
  # (git worktree of the `demo` branch), matching the demo-web pattern.
  demo-attendance-auto-close:
    image: naffai-demo-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 17:00' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=17,minute=0,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] demo-attendance-auto-close sleep $$sleep_sec s (until 22:00 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] attendance_auto_close (demo DB)"
          python manage.py attendance_auto_close || echo "attendance_auto_close rc=$$?"
        done

  # Daily lessons — generate yesterday's summary for every operator
  # once per calendar day (loop sleeps 6h between passes; the command
  # itself is idempotent — skips operators that already have a lesson
  # for the target date).
  lesson-generator:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          echo "[$(date +%FT%T%z)] generate_daily_lessons start"
          python manage.py generate_daily_lessons || echo "generate_daily_lessons failed rc=$?"
          echo "[$(date +%FT%T%z)] generate_daily_lessons done — sleep 21600s"
          sleep 21600
        done

  # Утренняя раздача — раз в сутки в 08:30 Asia/Tashkent (03:30 UTC).
  # Сначала одноразово подтягиваем свежие строки из Google Sheets, потом
  # раздаём все unassigned активные лиды поровну между активными операторами.
  # sheet-sync параллельно продолжает крутиться каждые 5 минут — если он
  # уже подтянул нужное, повторный вызов из morning-splitter идемпотентен.
  morning-splitter:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 03:30' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=3,minute=30,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] morning-splitter sleep $$sleep_sec s (until 08:30 Tashkent)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] sync_sheets_leads (одноразово, перед раздачей)"
          python manage.py sync_sheets_leads || echo "sync_sheets_leads rc=$$?"
          echo "[$$(date +%FT%T%z)] morning_distribute"
          python manage.py morning_distribute || echo "morning_distribute rc=$$?"
        done

  # Bot reports scheduler — раз в минуту проходит по BotReport(enabled=True),
  # рассылает те, чей schedule_time наступил + last_sent_at != today.
  # Идемпотентно (guard в scheduler.report_should_fire) — при рестарте
  # контейнера в течение того же дня повторной рассылки не будет.
  reports-scheduler:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          python manage.py send_scheduled_reports || echo "send_scheduled_reports rc=$$?"
          sleep 180
        done

  # Distribute-watcher — раз в минуту проходит по активным операторам,
  # у кого working_count=0, и доливает им пачку из общего пула сирот.
  # Дополняет `_run_refill_if_empty` (хук в lead_update_status): если
  # оператор уже с 0 закрытыми, но пул был пуст, а потом sheet-sync
  # притащил новые — оператор получит их без ожидания следующего close.
  # Уважает SystemSetting.auto_distribution_enabled (killswitch в UI).
  distribute-watcher:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          python manage.py refill_idle_operators || echo "refill_idle rc=$$?"
          sleep 300
        done

  # ⛔ 2026-08-06: auto-closer отключён по запросу.
  # Перезаписывал операторский статус (has_debt/phone_on/no_answer/…) на LOST
  # в 00:30 Asia/Tashkent → лид пропадал из фильтра по статусу на следующий день,
  # хотя оператор ожидал видеть его как «мои обработанные под этим статусом».
  # Долгий фикс — SystemSetting.auto_close_stale_enabled + UI-тумблер, тогда
  # раскомментировать сервис и гейтить `auto_close_stale_leads.handle` флагом.
  # Пока — сервис не запускается.
  #
  # Auto-closer — раз в сутки в 00:30 Asia/Tashkent (19:30 UTC).
  # Закрывает как LOST вчерашние non-carry активные лиды оператора,
  # которые он тронул вчера или раньше, но так и не завершил. Запускаем
  # ЗА 8 часов до утренней раздачи (08:30 TSH), чтобы освободить плечи
  # оператора и morning-splitter мог им долить свежих. См.
  # `apps/leads/management/commands/auto_close_stale_leads.py`.
  # auto-closer:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   command:
  #     - "bash"
  #     - "-c"
  #     - |
  #       while :; do
  #         now_epoch=$$(date -u +%s)
  #         today_target=$$(date -u -d 'today 19:30' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=19,minute=30,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
  #         if [ "$$now_epoch" -ge "$$today_target" ]; then
  #           tomorrow_target=$$((today_target + 86400))
  #           sleep_sec=$$((tomorrow_target - now_epoch))
  #         else
  #           sleep_sec=$$((today_target - now_epoch))
  #         fi
  #         echo "[$$(date +%FT%T%z)] auto-closer sleep $$sleep_sec s (until 00:30 Tashkent)"
  #         sleep "$$sleep_sec"
  #         echo "[$$(date +%FT%T%z)] auto_close_stale_leads"
  #         python manage.py auto_close_stale_leads || echo "auto_close_stale_leads rc=$$?"
  #       done

  # Sheet sync — pull new leads from Google Sheets every 5 minutes.
  # Kept separate from `scheduler` so an analyze/LLM stall never blocks
  # inbound leads (or vice versa). Every iteration logs via docker logs.
  sheet-sync:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          echo "[$(date +%FT%T%z)] sync_sheets_leads start"
          python manage.py sync_sheets_leads || echo "sync_sheets_leads failed rc=$?"
          echo "[$(date +%FT%T%z)] sync_sheets_leads done — sleep 300s"
          sleep 300
        done

  # Nightly writeback reconcile — читает D-колонку srm, сравнивает с
  # Lead.status за 30 дней, перезаписывает все расхождения (empty /
  # mismatch). Запуск в 22:00 UTC (03:00 Tashkent) чтобы не мешать
  # дневной активности.
  writeback-reconcile:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          now_epoch=$$(date -u +%s)
          today_target=$$(date -u -d 'today 22:00' +%s 2>/dev/null || python -c "import datetime,calendar; d=datetime.datetime.utcnow().replace(hour=22,minute=0,second=0,microsecond=0); print(calendar.timegm(d.timetuple()))")
          if [ "$$now_epoch" -ge "$$today_target" ]; then
            tomorrow_target=$$((today_target + 86400))
            sleep_sec=$$((tomorrow_target - now_epoch))
          else
            sleep_sec=$$((today_target - now_epoch))
          fi
          echo "[$$(date +%FT%T%z)] writeback-reconcile sleep $$sleep_sec s (until 22:00 UTC)"
          sleep "$$sleep_sec"
          echo "[$$(date +%FT%T%z)] writeback_reconcile_srm --days 30"
          python manage.py writeback_reconcile_srm --days 30 || echo "writeback_reconcile_srm rc=$$?"
        done

  # Hot-sheets sync — SheetSource(is_hot=True) синк каждую минуту,
  # чтобы ТЕЗ10 лиды попадали в систему быстро (до истечения 10-мин SLA).
  # Обычный sheet-sync продолжает тикать по всем шитам раз в 5 мин.
  hot-sheet-sync:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          python manage.py sync_sheets_leads --hot-only || echo "hot-sheet-sync rc=$?"
          sleep 60
        done

  # In-app уведомление оператору «ты опоздал» — 1 раз за смену
  # (idempotent через AttendanceLog.late_notified_at). Тик каждые 5 мин.
  attendance-late-watch:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          python manage.py attendance_late_notification || echo "att_late rc=$$?"
          sleep 300
        done

  # In-app уведомление «пора закрыть смену» через N часов после /checkin
  # (default 9). Игнорирует смены старше вчерашнего дня — иначе на первом
  # старте разошлёт всем недоделанным логам за месяц. Тик каждые 15 мин.
  attendance-nine-hour-watch:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          python manage.py attendance_nine_hour_notification || echo "att_9h rc=$$?"
          sleep 900
        done

  # Отложенный retry лидов qimmatlik_qildi — клиенту не должны звонить
  # два оператора в один день. Правило (см. _next_qimmatlik_retry_at):
  # до 13:00 — retry сегодня в 16:00; после 13:00 — завтра в 09:30.
  # Метка лежит в Lead.metadata["qimmatlik_retry_at"]; watcher тикает
  # каждые 10 минут.
  qimmatlik-retry-watch:
    image: naffai-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        sleep $$((RANDOM % 60))
        while :; do
          python manage.py qimmatlik_retry_due || echo "qimmatlik_retry rc=$$?"
          sleep 600
        done


  # Demo-mirror для hot-leads-watch. ТЕЗ-эскалация пишет в demo DB через
  # .env.demo override. Контекст сборки — /opt/naffAI-demo/backend
  # (git worktree ветки demo). Матчит паттерн demo-apply-day-offs.
  # Prod-сервис hot-leads-watch НЕ добавляем — prod не трогаем до явной
  # команды пользователя. См. commit ad5f732 для прод-варианта.
  demo-hot-leads-watch:
    image: naffai-demo-backend:latest
    pull_policy: never
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
    command:
      - "bash"
      - "-c"
      - |
        while :; do
          python manage.py hot_leads_escalation || echo "hot_leads_escalation rc=$$?"
          sleep 60
        done
volumes:
  postgres-data:
