[project]
name = "naffai-backend"
version = "0.1.0"
description = "Sales tracking & call-center operator management for a phone retail shop"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<6.0",
  "djangorestframework>=3.15",
  "django-cors-headers>=4.4",
  "django-filter>=24.3",
  "psycopg[binary]>=3.2",
  "python-decouple>=3.8",
  "gunicorn>=23.0",
  "openpyxl>=3.1",
  "drf-spectacular>=0.27",
  "httpx>=0.27",
  "pydantic>=2.9",
  "aiogram>=3.13",
  "google-auth>=2.35",
  "cryptography>=43.0",
  "telethon>=1.36",
  "asgiref>=3.8",
  "google-genai>=1.0",
  "sentry-sdk[django]>=2.0",
  "qrcode[pil]>=8.0",
  # 2026-08-14 attendance photo redesign.
  # MediaPipe → face-presence detection (~10 MB whl, ~150 MB RSS warm).
  # opencv-python-headless → fallback if MediaPipe fails to import.
  # imagehash → perceptual hash (anti-dup 24h window).
  "mediapipe>=0.10,<0.11",
  # Pin to 4.x — opencv-python-headless 5.x dropped CascadeClassifier so
  # our Haar fallback becomes silent-no-op. 4.10 is the LTS ARM64 wheel.
  "opencv-python-headless>=4.10,<5",
  "imagehash>=4.3",
  # 2026-08-22 Wave-1: Redis cache для dashboard-summary + lead-stats
  # (TTL 60s, ручная инвалидация в sale-services + lead_update_status).
  # `django-redis` — тонкий backend поверх `redis-py`; LocMemCache остаётся
  # автоматическим fallback'ом когда REDIS_URL пуст (тесты, dev без docker).
  "django-redis>=5.4",
  # 2026-08-31: attendance-based payroll — PDF export через reportlab
  # (pure-python, без системных .so). Excel остаётся на openpyxl.
  "reportlab>=4.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs[compatible-mypy]>=5.0",
  "djangorestframework-stubs[compatible-mypy]>=3.15",
  "freezegun>=1.5",
  "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "RUF"]
# E501 — длинные строки; RUF012 — class-level mutables (DRF permission_classes); RUF001-003 — кириллица в строках/комментариях (UI на русском)
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
markers = [
    "pin_gate: тесты самого attendance-PIN-gate — conftest НЕ мокает сессию",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
