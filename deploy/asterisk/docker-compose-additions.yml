# --- Добавить в .env (в /opt/naffAI/.env): -----------------------------------
#
#  # ==== Asterisk (Phase 2) ====
#  ASTERISK_AMI_HOST=sip.naff.flek.uz
#  ASTERISK_AMI_PORT=5038
#  ASTERISK_AMI_USERNAME=naffai
#  ASTERISK_AMI_SECRET=<generate: openssl rand -hex 32>
