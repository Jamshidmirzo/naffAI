#
# --- На стороне VPS (/etc/asterisk/manager.conf): ----------------------------
#
#  [general]
#  enabled = yes
#  port = 5038
#  bindaddr = 0.0.0.0
#  ; Ограничить IP основного сервера naff!
#
#  [naffai]
#  secret = <ASTERISK_AMI_SECRET из .env выше>
#  deny=0.0.0.0/0
#  permit=<PUBLIC_IP основного naff-сервера>/32
#  read = system,call,cdr,dialplan
#  write = system,call,originate
