# coturn — minimal TURN/STUN config shared with LiveKit SFU.
# Users don't log into coturn directly; LiveKit mints time-limited
# credentials signed with `static-auth-secret` below. Keep this value
# matched to LIVEKIT_TURN_SECRET on the SFU side.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# External IP of the Lightsail host — must be its elastic / public
# address, otherwise ICE candidates will be bogus.
# external-ip=... set via env in docker-compose.

fingerprint
lt-cred-mech

# Shared-secret auth. coturn verifies incoming creds against this.
# Env overrides it via `TURN_SHARED_SECRET`.
static-auth-secret=change-me-in-env

realm=demo.naff.flek.uz
total-quota=0
bps-capacity=0
stale-nonce=600

min-port=50000
max-port=50200

no-stdout-log
log-file=stdout
simple-log

# Prevent abuse — relay-only, no inbound requests.
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# ...but we DO want to allow the LiveKit container network.
allowed-peer-ip=172.20.0.0-172.20.255.255
