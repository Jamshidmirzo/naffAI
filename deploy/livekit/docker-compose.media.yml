# Live-эфир media server (Lightsail `naffai-media`): LiveKit SFU + egress
# (recording) + redis, shared by prod and demo. Kept off the CRM host so
# video load never slows the CRM down.
#
# Host networking: WebRTC ports go straight to the processes (no
# docker-proxy per UDP port, no NAT hairpin between egress and the SFU).
# Lightsail firewall: 7881/tcp, 7882/udp, 3478/udp public; 7880/tcp only
# from the CRM host (nginx /livekit/ and the backend API calls).
#
# .env next to this file (written by deploy/deploy-media.sh):
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET — same as the CRM's .env
#   MEDIA_PUBLIC_IP                     — advertised for media and TURN
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  livekit-redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    # Rooms + egress bus: never evict.
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    depends_on:
      livekit-redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
          json: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        redis:
          address: 127.0.0.1:6379
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${MEDIA_PUBLIC_IP}
        turn:
          enabled: true
          domain: ${MEDIA_PUBLIC_IP}
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30100
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://naff.flek.uz/api/live/webhooks/livekit/
            - https://demo.naff.flek.uz/api/live/webhooks/livekit/
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 120

  # Track egress: the operator's H.264 track goes into an mp4 in S3 without
  # transcoding; bucket + keys come from the backend with every request.
  egress:
    image: livekit/egress:v1.14.1
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    depends_on:
      - livekit
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        health_port: 7980
        # Track egress does not transcode; the default cost assumes composite.
        cpu_cost:
          max_cpu_utilization: 0.9
          track_cpu_cost: 0.1
    volumes:
      - egress-tmp:/tmp
    shm_size: 512mb

volumes:
  egress-tmp:
