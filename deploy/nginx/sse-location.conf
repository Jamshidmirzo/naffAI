# SSE location snippet — вставить в server-блок demo.naff.flek.uz (и
# позже prod naff.flek.uz, когда дадут green-light). Отключает любую
# буферизацию и кеш, иначе nginx держит ответ пока не наберётся буфер
# либо коннект закрывается по таймауту.
#
# Пример использования в /etc/nginx/sites-enabled/demo.naff.flek.uz:
#
#     include /opt/naffAI/deploy/nginx/sse-location.conf;
#
# или скопируйте тело блока в server-блок перед общим `location /api/`.
#
# ВАЖНО: location должен идти ДО более общего `location /api/` в том же
# server-блоке — nginx берёт лонгест-префикс, но в текущем конфиге
# явный location всё равно безопаснее.

location /api/notifications/stream/ {
    proxy_pass http://127.0.0.1:8001;  # demo-web; для prod — 8000

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    # SSE критично:
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;

    # X-Accel-Buffering: no backend тоже отдаёт — двойной страховочный
    # заслон, если какой-то reverse-proxy в цепочке проигнорирует flag.
    add_header X-Accel-Buffering no always;
}
