<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Табло на экране</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="naff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nf" data-theme="dark" style="min-height: 1140px; display: flex; flex-direction: column">
<i class="ikat" style="height: 16px" aria-hidden="true"></i>
<div class="row between" style="padding: 32px 56px 8px">
<div class="col g6"><span class="lbl" style="color: var(--brand-text)">Табло продаж · сегодня</span><span class="row g12"><span class="display" style="font-size: 44px; line-height: 52px">241,6 млн · 23 шт</span><span class="badge b-info" style="height: 20px">новое</span></span></div>
<div class="col g6" style="align-items: flex-end"><span class="num" style="font-size: 32px; font-weight: 600">14:22</span><span class="xs c3">обновление каждые 30 сек</span><button class="btn btn-ghost btn-sm" type="button">Выйти</button></div>
</div>
<div class="col g12" style="padding: 24px 56px 32px; height: 660px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="row g24" style="padding: 16px 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
<span class="display" style="font-size: 40px; width: 64px; color: {{r.c}}">{{r.rank}}</span>
<span class="ava ava-xl">{{r.ini}}</span>
<span class="row g16 grow" style="align-items: baseline; min-width: 0"><span class="display trunc" style="font-size: 34px">{{r.name}}</span><span class="num c3" style="font-size: 26px; flex: none">{{r.n}} шт</span></span>
<span class="display" style="font-size: 44px; color: {{r.sc}}">{{r.sum}}</span>
</div>
</sc-for>
</div>
<div class="col g12" style="padding: 8px 56px 40px; border-top: 1px dashed var(--line-2)">
<span class="when" style="margin-top: 16px">Пустое состояние — за период ещё нет продаж</span>
<div class="col" style="align-items: center; justify-content: center; gap: 10px; height: 220px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
<svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-4)"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"></path></svg>
<span class="display c3" style="font-size: 26px">Пока нет данных за месяц</span>
<span class="s c3">Табло заполнится после первой подтверждённой продажи</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1140}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ rank: 1, c: 'var(--warn-solid)', sc: 'var(--warn-solid)', ini: 'JT', name: 'Jasur Toshmatov', n: 6, sum: '58,3 млн' },
{ rank: 2, c: 'var(--ink-2)', sc: 'var(--ink)', ini: 'NS', name: 'Nilufar Saidova', n: 5, sum: '47,9 млн' },
{ rank: 3, c: 'var(--hot-solid)', sc: 'var(--ink)', ini: 'SK', name: 'Shahlo Komilova', n: 4, sum: '39,1 млн' },
{ rank: 4, c: 'var(--ink-3)', sc: 'var(--ink)', ini: 'GK', name: 'Gulnoza Karimova', n: 3, sum: '33,6 млн' },
{ rank: 5, c: 'var(--ink-3)', sc: 'var(--ink)', ini: 'OE', name: 'Otabek Ergashev', n: 3, sum: '27,2 млн' }
]
};
}
}
</script>
</body>
</html>
