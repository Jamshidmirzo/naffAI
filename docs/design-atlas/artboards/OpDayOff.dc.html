<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выходной</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="naff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nf shell" data-theme="{{theme}}" style="min-height: 860px">
<div class="rail-wrap"><dc-import name="SideNav" who="operator" at="dayoff" hint-size="84px,860px"></dc-import></div>
<div class="main-col">

<header class="top">
<h1 class="h1">Выходной</h1>
<span class="grow"></span>
<span class="s c3">По графику выходной в воскресенье · без штрафа можно пропустить 1 день в неделю</span>
</header>

<main class="page">
<div class="split">

<form class="panel card col" style="flex: 1 1 400px">
<div class="card-h"><span class="h3">Новая заявка</span></div>
<div class="col g16 pad" style="padding: 20px">
<div class="field"><label for="do-date">Дата</label><input class="input num" id="do-date" type="text" value="18.10.2026, суббота"></div>
<div class="field"><label for="do-reason">Причина</label><textarea class="input" id="do-reason" rows="3">Свадьба брата, нужен целый день.</textarea><span class="hint">Менеджер увидит причину и сколько продаж у тебя за неделю.</span></div>
<button class="btn btn-pri btn-lg" type="button">Отправить заявку</button>
</div>
</form>

<section class="list card col">
<div class="card-h"><span class="h3">Мои заявки</span><span class="xs c3">последние 3</span></div>
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
<div class="row-item" style="align-items: flex-start">
<div class="col" style="width: 160px; flex: none; gap: 2px"><span class="w6">{{r.date}}</span><span class="xs c3">{{r.sent}}</span></div>
<div class="col grow" style="gap: 2px"><span class="s">{{r.reason}}</span><sc-if value="{{r.answer}}" hint-placeholder-val="{{ false }}"><span class="xs c3">{{r.answer}}</span></sc-if></div>
<span class="badge {{r.tone}}"><i class="dot"></i>{{r.status}}</span>
</div>
</sc-for>
</section>

</div>
</main>
</div>

<div class="toast" role="status" style="position: absolute; right: 24px; bottom: 24px">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
Заявка на 18 октября отправлена менеджеру
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'light',
reqs: [
{ date: '18.10, суббота', sent: 'отправлена сегодня', reason: 'Свадьба брата, нужен целый день.', answer: '', status: 'На рассмотрении', tone: 'b-warn' },
{ date: '04.10, суббота', sent: '28.09', reason: 'Визит к врачу утром.', answer: 'Kamola Ahmedova: одобрено, выйди после 14:00', status: 'Одобрен', tone: 'b-ok' },
{ date: '20.09, суббота', sent: '19.09', reason: 'Личные дела.', answer: 'Kamola Ahmedova: в субботу акция, нужен на смене', status: 'Отклонён', tone: 'b-bad' }
]
};
}
}
</script>
</body>
</html>
