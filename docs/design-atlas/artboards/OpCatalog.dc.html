<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог телефонов</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="naff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nf shell" data-theme="{{theme}}" style="min-height: 960px">
<div class="rail-wrap"><dc-import name="SideNav" who="operator" at="catalog" hint-size="84px,960px"></dc-import></div>
<div class="main-col">

<header class="top">
<h1 class="h1">Каталог телефонов</h1>
<span class="grow"></span>
<div class="inwrap" style="width: 300px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg><input class="input" type="search" placeholder="Бренд или модель" aria-label="Поиск по каталогу"></div>
<div class="seg"><button class="is-on" type="button">Все</button><button type="button">В наличии</button><button type="button">Под заказ</button><button type="button">Нет</button></div>
</header>

<main class="page">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="8">
<section class="card col" style="overflow: hidden">
<div class="ph" style="height: 150px; border-radius: 0; border: 0; border-bottom: 1px solid var(--line)"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2"></path></svg>{{p.cover}}</div>
<div class="col g8" style="padding: 12px 14px 14px">
<div class="row between g8"><span class="h3 trunc">{{p.name}}</span><span class="badge {{p.stockTone}}">{{p.stock}}</span></div>
<span class="xs c3">{{p.spec}}</span>
<div class="row between" style="align-items: baseline"><span class="num w6" style="font-size: 16px">{{p.price}}</span><span class="xs c3">от <span class="num">{{p.month}}</span>/мес</span></div>
<div class="row g6">
<button class="btn btn-sm grow" type="button">Текст</button>
<button class="btn btn-sm grow" type="button" disabled="{{p.noPhoto}}">Фото</button>
<button class="btn btn-sm grow" type="button">Реклама</button>
</div>
</div>
</section>
</sc-for>
</div>
<div class="row g12">
<span class="toast"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ok-solid)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Текст для клиента скопирован</span>
<span class="s c3">Кнопки копируют готовый текст, фото или рекламный текст, чтобы отправить клиенту в Telegram.</span>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const p = (name, spec, price, month, stock, cover) => ({ name: name, spec: spec, price: price, month: month, stock: stock, stockTone: stock === 'В наличии' ? 'b-ok' : stock === 'Под заказ' ? 'b-warn' : '', noPhoto: cover === 'нет фото', cover: cover });
return {
theme: this.props.theme ?? 'light',
phones: [
p('iPhone 15 Pro', '256 GB · 8 GB RAM · 3 цвета', '14 500 000', '1 333 333', 'В наличии', 'Обложка'),
p('iPhone 15', '128 GB · 6 GB RAM · 4 цвета', '12 700 000', '1 167 000', 'В наличии', 'Обложка'),
p('Samsung Galaxy S24', '256 GB · 8 GB RAM', '11 900 000', '1 093 000', 'В наличии', 'Обложка'),
p('Samsung Galaxy A55', '128 GB · 8 GB RAM', '5 200 000', '478 000', 'Под заказ', 'Обложка'),
p('Redmi Note 13 Pro', '256 GB · 8 GB RAM', '4 100 000', '377 000', 'В наличии', 'Обложка'),
p('Honor X9b', '256 GB · 12 GB RAM', '3 900 000', '358 000', 'Под заказ', 'нет фото'),
p('iPhone 13', '128 GB · 4 GB RAM', '8 900 000', '818 000', 'Нет', 'Обложка'),
p('iPhone 15 Pro Max', '256 GB · 8 GB RAM', '17 400 000', '1 600 000', 'Под заказ', 'Обложка')
]
};
}
}
</script>
</body>
</html>
