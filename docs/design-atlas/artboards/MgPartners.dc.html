<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Партнёры</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="naff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nf shell" data-theme="{{theme}}" style="min-height: 860px">
<div class="side-wrap"><dc-import name="SideNav" who="manager" at="partners" hint-size="248px,860px"></dc-import></div>
<div class="main-col">
<header class="top"><h1 class="h1">Партнёры</h1><span class="s c3">способы оплаты: банки рассрочки и наличные</span></header>
<main class="page">
<div class="row g24" style="align-items: flex-start; flex-wrap: wrap">
<nav class="sub-nav" aria-label="Разделы настроек">
<a href="MgSettingsGeneral.dc.html">Общие</a><a href="MgAttSettings.dc.html">Смены и зарплата</a><a href="MgSettings.dc.html">Статусы лидов</a><a href="MgSheets.dc.html">Источники лидов</a><a href="MgCatalog.dc.html">Каталог и рассрочка</a><a class="is-on" href="MgPartners.dc.html" aria-current="page">Партнёры</a><a href="MgBot.dc.html">Telegram-бот</a><a href="MgUsers.dc.html">Пользователи</a><a href="MgTraining.dc.html">Обучение</a>
</nav>
<section class="card col grow" style="min-width: 0; max-width: 760px">
<div class="card-h"><span class="h3">Всего 7 · активны 5</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div class="li" style="min-height: 56px"><span class="icon-tile">{{r.ini}}</span><span class="col grow"><span class="s w6">{{r.n}}</span><span class="xs c3">{{r.note}}</span></span><span class="badge {{r.tone}}">{{r.st}}</span><button class="switch {{r.on}}" type="button" aria-label="{{r.n}}: {{r.st}}"><i></i></button></div>
</sc-for>
<div class="col g8" style="padding: 14px 16px; border-top: 1px solid var(--line)">
<div class="row g8"><input class="input is-bad grow" type="text" value="Alif" aria-label="Название нового партнёра"><button class="btn btn-pri" type="button" disabled="{{yes}}">Добавить</button></div>
<span class="err">Партнёр «Alif» уже есть</span>
</div>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const r = (n, note, on) => ({ n: n, ini: n.slice(0, 2), note: note, st: on ? 'активен' : 'выключен', tone: on ? 'b-ok' : '', on: on ? 'is-on' : '' });
return {
theme: this.props.theme ?? 'light',
yes: true,
rows: [r('Alif', '41% выручки в октябре', true), r('Uzum', '26% выручки', true), r('Hamroh', '13% выручки', true), r('TBC', '11% выручки', true), r('Cash', 'наличные, 9% выручки', true), r('Birzum', 'нет продаж с августа', false), r('Anor', 'нет продаж с июля', false)]
};
}
}
</script>
</body>
</html>
