<sc-if value="{{rail}}" hint-placeholder-val="{{ false }}">
<nav class="rail" aria-label="{{navLabel}}" style="min-height: 960px; font-family: var(--font); color: var(--ink)">
<div class="col" style="align-items: center; gap: 4px; padding: 2px 0 10px">

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<i class="hr" style="width: 40px; margin: 4px 0" aria-hidden="true"></i>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a class="rail-item {{it.cls}}" href="{{it.href}}"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.d}}"></path></svg><span>{{it.short}}</span><sc-if value="{{it.cnt}}" hint-placeholder-val="{{ false }}"><span class="cnt {{it.cntCls}}">{{it.cnt}}</span></sc-if></a>
</sc-for>
</sc-for>
<div class="col" style="align-items: center; gap: 8px; margin-top: auto; padding-top: 12px">
<span class="ava" data-s="on" title="{{me.name}}">{{me.ini}}</span>
<button class="btn btn-ghost btn-sq btn-sm" type="button" aria-label="{{logoutLabel}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h9"></path></svg></button>
</div>
</nav>
</sc-if>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<nav class="side" aria-label="{{navLabel}}" style="min-height: 960px; font-family: var(--font); color: var(--ink)">
<div class="wordmark"><i class="ikat ikat-mark" aria-hidden="true"></i>naff<b>AI</b></div>
<button class="cmd" type="button" style="min-width: 0; margin: 0 2px 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>{{cmdLabel}}<span class="kbd">⌘K</span></button>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{g.title}}" hint-placeholder-val="{{ true }}"><button class="side-grp is-open" type="button" aria-expanded="true"><span class="grow">{{g.title}}</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button></sc-if>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
<a class="side-item {{it.cls}}" href="{{it.href}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.d}}"></path></svg><span class="grow trunc">{{it.label}}</span><sc-if value="{{it.tag}}" hint-placeholder-val="{{ false }}"><span class="side-tag">{{it.tag}}</span></sc-if><sc-if value="{{it.cnt}}" hint-placeholder-val="{{ false }}"><span class="cnt {{it.cntCls}}">{{it.cnt}}</span></sc-if></a>
</sc-for>
</sc-if>
<sc-if value="{{g.closed}}" hint-placeholder-val="{{ false }}">
<button class="side-grp" type="button" aria-expanded="false"><span class="grow">{{g.title}}</span><span class="side-n">{{g.n}}</span><sc-if value="{{g.cnt}}" hint-placeholder-val="{{ false }}"><span class="cnt">{{g.cnt}}</span></sc-if><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</sc-if>
</sc-for>
<div class="row g6" style="margin-top: auto; padding: 12px 6px 4px 10px; border-top: 1px solid var(--line)">
<a class="row g8 grow {{me.cls}}" href="{{me.profile}}" style="min-width: 0; border-radius: 9px"><span class="ava">{{me.ini}}</span><span class="col grow" style="min-width: 0"><span class="s w6 trunc">{{me.name}}</span><span class="xs c3">{{me.role}}</span></span></a>
<a class="btn btn-ghost btn-sq btn-sm {{me.bellCls}}" href="{{me.notif}}" aria-label="{{me.bellLabel}}" style="position: relative"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"></path></svg><span class="cnt" style="position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; font-size: 10.5px">{{me.bell}}</span></a>

</nav>
</sc-if>
